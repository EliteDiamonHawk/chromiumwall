<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChromiumWall probe</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; }
    body { margin: 2rem; background: #17202a; color: #f4f6f7; }
    code { color: #76d7c4; }
  </style>
</head>
<body>
  <h1>ChromiumWall Chromium probe</h1>
  <p>Logical window: <code id="window">unknown</code></p>
  <p>Launch token: <code id="token">missing</code></p>
  <p>This page sets the native window title to <code>ChromiumWall::&lt;token&gt;</code>.</p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const logicalWindow = params.get('window') || 'unknown';
    const token = params.get('token') || '';
    document.title = `ChromiumWall::${token}`;
    document.getElementById('window').textContent = logicalWindow;
    document.getElementById('token').textContent = token || 'missing';
  </script>
</body>
</html>
